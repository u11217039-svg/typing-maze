function end(win,msg){const g=G,acc=g.keys?g.ok/g.keys:1,wpm=g.play>1?g.ok/5/(g.play/60):0,A=Math.round(acc*100),Wp=Math.round(wpm),rk=win?(A>=95&&Wp>=25?'S':A>=90?'A':A>=80?'B':'C'):'✕';g.over=1;saveW();sfx(win?'w':'l');let rec='';
 if(win){const b=ld();if(!b[g.lv]||wpm>b[g.lv].w){rec=b[g.lv]?' 🏆 新紀錄！':'';b[g.lv]={w:Wp,a:A};sv(b)}}
 $('#rk').textContent=rk;$('#rk').className='rk r'+(win?rk:'X');$('#et').textContent=win?'🎉 過關！'+rec:'💥 挑戰失敗';$('#em').textContent=msg;
 $('#st').innerHTML=[[A+'%','正確率'],[Wp,'WPM 速度'],[Math.round(g.play)+' 秒','用時'],[g.steps,'走了幾步'],[g.maxh-g.hearts,'失去的心']].map(([v,t])=>'<div class="stat"><b>'+v+'</b>'+t+'</div>').join('');
 $('#ws').innerHTML=Object.entries(g.miss).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>'<span class="chip"><b>'+k.toUpperCase()+'</b> ×'+v+'</span>').join('')||'沒有打錯，完美！';$('#next').hidden=!(win&&g.lv<5);show('end')}
$('#retry').onclick=()=>start(G.lv);$('#next').onclick=()=>start(G.lv+1);$('#tomenu').onclick=()=>show('menu');$('#quit').onclick=()=>show('menu');
$('#mapbtn').onclick=()=>{toggleMap();document.activeElement.blur()};function toggleMap(){showMap=!showMap;$('#mm').hidden=!showMap}
function msg(t){const m=$('#msg');m.textContent=t;clearTimeout(mt);mt=setTimeout(()=>m.textContent='',1300)}
function shake(){const v=$('#view');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake')}
function good(c){sfx('k');if(WK[c])WK[c]=Math.max(0,WK[c]-.25)}
function bad(){sfx('x');G.lock=-1;G.prog=0;if(G.lv>1)G.dl-=1000;msg('打錯了，這題重來！');shake();rp()}
function pause(){if(cur==='game'&&!G.paused&&!G.over){G.paused=performance.now();$('#ps').hidden=false}}
function resume(){if(!G.paused)return;G.dl+=performance.now()-G.paused;G.paused=0;$('#ps').hidden=true}
$('#ps').onclick=resume;$('#pb2').onclick=()=>{pause();document.activeElement.blur()};addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>document.hidden&&pause());
document.addEventListener('keydown',e=>{
 if(cur!=='game')return;if(e.key===S.pk&&!G.over){e.preventDefault();if(!e.repeat)G.paused?resume():pause();return}
 if(e.key==='Process'||e.isComposing||e.keyCode===229){msg('偵測到中文輸入法，請切換成英文！');return}
 if(e.key==='Tab'){e.preventDefault();toggleMap();return}if(e.key===' ')e.preventDefault();
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||G.paused||G.over)return;
 const c=e.key.toLowerCase();if(!/[a-z]/.test(c))return;wake();const g=G;g.keys++;
 if(g.lock<0){const i=g.ps.findIndex(p=>p.w[0]===c);if(i<0)return bad();g.lock=i;g.prog=1;g.ok++;good(c)}
 else{const w=g.ps[g.lock].w;if(w[g.prog]!==c){const q=w[g.prog];g.miss[q]=(g.miss[q]||0)+1;WK[q]=(WK[q]||0)+1;return bad()}g.prog++;g.ok++;good(c)}
 if(g.prog===g.ps[g.lock].w.length)go(g.ps[g.lock]);else rp()});
// 偽 3D 走廊：磚縫、地磚線、火把光暈
const sh=i=>'hsl(222 16% '+42/(1+.55*i)+'%)';
function draw(t){const c=cv,g=G,s=z=>1/(1+.8*z),L=z=>W/2*(1-s(z)),R=z=>W/2*(1+s(z)),T=z=>H/2*(1-s(z)),B=z=>H/2*(1+s(z));
 let x=g.x,y=g.y;const cs=[];for(let i=0;i<5;i++){cs.push([x,y]);if(!g.o[x][y][g.dir])break;x+=DX[g.dir];y+=DY[g.dir]}
 const n=cs.length-1,[ex,ey]=cs[n],wall=!g.o[ex][ey][g.dir],z=n+1;
 let q=c.createLinearGradient(0,0,0,H/2);q.addColorStop(0,'#04060c');q.addColorStop(1,'#1c2438');c.fillStyle=q;c.fillRect(0,0,W,H/2);
 q=c.createLinearGradient(0,H/2,0,H);q.addColorStop(0,'#10151f');q.addColorStop(1,'#2a3350');c.fillStyle=q;c.fillRect(0,H/2,W,H/2);
 c.strokeStyle='#ffffff18';c.lineWidth=1;for(let i=0;i<=z;i++){c.beginPath();c.moveTo(L(i),B(i));c.lineTo(R(i),B(i));c.stroke()}
 c.fillStyle=wall?(ex===N-1&&ey===N-1?'#d9a82b':sh(n+.5)):'#0a0d16';c.fillRect(L(z),T(z),R(z)-L(z),B(z)-T(z));
 for(let i=n;i>=0;i--){const[cx,cy]=cs[i];[3,1].forEach(k=>{const op=g.o[cx][cy][(g.dir+k)%4],f=k===3?L:R;c.fillStyle=op?'#06080e':sh(i);c.beginPath();c.moveTo(f(i),T(i));c.lineTo(f(i+1),T(i+1));c.lineTo(f(i+1),B(i+1));c.lineTo(f(i),B(i));c.closePath();c.fill();c.strokeStyle='#0008';c.lineWidth=2;c.stroke();
  if(!op){c.strokeStyle='#0005';c.lineWidth=1;[.33,.66].forEach(u=>{c.beginPath();c.moveTo(f(i),T(i)+(B(i)-T(i))*u);c.lineTo(f(i+1),T(i+1)+(B(i+1)-T(i+1))*u);c.stroke()})}})}
 const fl=.16+.03*Math.sin(t/140);q=c.createRadialGradient(W/2,H/2,10,W/2,H/2,H*.75);q.addColorStop(0,'rgba(255,170,60,'+fl+')');q.addColorStop(1,'rgba(255,170,60,0)');c.fillStyle=q;c.fillRect(0,0,W,H);
 const a=g.lv>1?(1-g.gap/g.cap)*.6+(g.gap<=1?.2:0):0;if(a){const r=c.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.8);r.addColorStop(0,'#f000');r.addColorStop(1,'rgba(220,0,0,'+a+')');c.fillStyle=r;c.fillRect(0,0,W,H)}
 if(g.lv>1&&g.gap<=1){c.font='64px serif';c.fillText('👹',14,H-14)}
 if(g.fade>0){c.fillStyle='rgba(0,0,0,'+g.fade*.7+')';c.fillRect(0,0,W,H)}}
function mini(){const c=mc,g=G,s=20;c.clearRect(0,0,120,120);c.fillStyle='rgba(80,200,120,.35)';g.path.forEach(([x,y])=>c.fillRect(x*s,y*s,s,s));
 c.strokeStyle='#cfd8ee';c.lineWidth=2;c.beginPath();for(let x=0;x<N;x++)for(let y=0;y<N;y++){const o=g.o[x][y];if(!o[0]){c.moveTo(x*s,y*s);c.lineTo(x*s+s,y*s)}if(!o[3]){c.moveTo(x*s,y*s);c.lineTo(x*s,y*s+s)}if(!o[1]){c.moveTo(x*s+s,y*s);c.lineTo(x*s+s,y*s+s)}if(!o[2]){c.moveTo(x*s,y*s+s);c.lineTo(x*s+s,y*s+s)}}c.stroke();
 c.font='14px sans-serif';c.fillStyle='#ffd166';c.fillText('★',(N-1)*s+3,(N-1)*s+16);
 if(g.lv>1){const[mx,my]=g.path[Math.max(0,g.path.length-1-g.gap)];c.fillStyle='#ff4d4d';c.beginPath();c.arc(mx*s+10,my*s+10,4,0,7);c.fill()}
 c.save();c.translate(g.x*s+10,g.y*s+10);c.rotate(g.dir*Math.PI/2);c.fillStyle='#ffd166';c.beginPath();c.moveTo(0,-7);c.lineTo(6,6);c.lineTo(-6,6);c.fill();c.restore()}
function hud(t){const g=G,f=g.lv===1,now=g.paused||t;$('#hl').textContent=LV[g.lv].ic+' '+LV[g.lv].n+(f?'・'+ROWN[S.row].slice(1):'');$('#hh').textContent=f?'':'❤️'.repeat(g.hearts)+'🖤'.repeat(g.maxh-g.hearts);$('#hg').textContent=f?'🕊 沒有怪物，慢慢練':'👹 '+'●'.repeat(Math.max(0,g.gap))+'○'.repeat(Math.max(0,g.cap-g.gap));
 $('#tb').hidden=f;if(!f){const r=Math.max(0,Math.min(1,(g.dl-now)/(g.lim*1000)));$('#tf').style.width=r*100+'%';$('#tf').className=r<.25?'low':''}}
let lt=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.1,(t-lt)/1000);lt=t;if(cur!=='game')return;const g=G;
 if(!g.paused&&!g.over){g.play+=dt;g.fade=Math.max(0,g.fade-dt*4);if(g.lv>1&&t>g.dl){g.gap--;g.dl=t+g.lim*1000;g.lock=-1;g.prog=0;msg('⏰ 超時！怪物逼近了');shake();sfx('t');if(g.gap<=0)return end(0,'被怪物追上了！');rp()}}
 if(g.over)return;if(g.lv>1&&g.gap<=1&&!g.paused&&t-(g.bp||0)>900){g.bp=t;sfx('a')}draw(t);if(showMap)mini();hud(t)}
menu();requestAnimationFrame(loop);
