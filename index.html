<div class="card"><h2>📌 開始前</h2><p class="mut">請先把輸入法切成<b>英文</b>（不是注音），使用實體鍵盤。教程可在設定選基準列／上排／下排／混合；單字母與亂碼關卡皆涵蓋 26 個字母；短單字、長單字各有 100 個單字。</p><div class="row"><button id="gs" class="s">⚙ 設定</button></div></div></aside></div></section>

</main><script>
